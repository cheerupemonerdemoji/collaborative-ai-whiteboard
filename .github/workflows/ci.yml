name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Typecheck
        run: corepack pnpm run typecheck

      - name: Test
        run: corepack pnpm run test

      # The production build requires VITE_TLDRAW_LICENSE_KEY, which is not
      # available to this workflow and must not be added as a public repo
      # secret for a client-bundle-inlined key. Typecheck + test is the CI
      # signal; a license-gated build stays a deploy-time step.
